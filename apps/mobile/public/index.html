<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable app: manifest, home screen icons and the iOS "web app" mode. -->
    <link rel="manifest" href="/appli-poker/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/appli-poker/icons/apple-touch-icon.png" />
    <!-- The game server: connecting early saves the first request a few round trips. -->
    <link rel="preconnect" href="https://kjxzzcenvssemsftczfh.supabase.co" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" keeps the page below the clock and battery: with "black-translucent" they covered the back buttons. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="La Tablée" />
    <meta name="application-name" content="La Tablée" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0b1f17;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Il faut activer JavaScript pour lancer l'appli.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
