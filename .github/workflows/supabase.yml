name: Déploiement Supabase

# Applies database migrations and deploys the game server whenever main changes.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/engine/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: kjxzzcenvssemsftczfh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Copier le moteur du jeu dans la fonction
        # The repo links the engine with a symlink; ship real files to be safe.
        run: |
          rm supabase/functions/_shared/engine
          cp -r packages/engine/src supabase/functions/_shared/engine
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy poker --project-ref "$PROJECT_REF"
