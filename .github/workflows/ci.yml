name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérification des types de l'appli
        run: npx tsc --noEmit
        working-directory: apps/mobile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Vérification des types du serveur
        run: deno check index.ts
        working-directory: supabase/functions/poker
