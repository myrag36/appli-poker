name: Site web

# Publishes the web version of the app on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/engine/**'
      - '.github/workflows/site-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: |
          npx expo export --platform web
          # Lets a reload on any path still open the app.
          cp dist/index.html dist/404.html
        working-directory: apps/mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
